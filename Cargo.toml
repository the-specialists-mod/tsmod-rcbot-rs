[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/the-specialists-mod/tsmod-rcbot-rs"

[workspace.dependencies]
rcbot = { path = "crates/rcbot" }
# The port's plugin API v4 (the-specialists-mod/the-specialistsmod-rs#104, #117) and the engine's
# tables, pinned to one rev of the port's main. goldsrc-sys generates its bindings from the FWGS headers
# (`FWGS_DIR`, see .cargo/config.toml).
goldsrc-sys = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "38cd7b8bac90696415d40afe019507b9d28d42c4" }
ts-plugin-api = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "38cd7b8bac90696415d40afe019507b9d28d42c4" }
# The visibility table's RCZ container is miniz's zlib stream (rc_compress.cpp); miniz_oxide is
# the Rust port of the same deflate code.
miniz_oxide = "0.8"

[profile.dev]
panic = "abort" # unwinding across the C ABI is UB; be explicit

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
